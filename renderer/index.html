<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LuckyDraw Offline</title><link rel="stylesheet" href="style.css"></head><body><div id="app"><aside><div class="brand">LUCKY<span>DRAW</span><small>OFFLINE</small></div><button class="nav active" data-page="draw">🎯 Quay thưởng</button><button class="nav" data-page="people">👥 Người tham gia</button><button class="nav" data-page="prizes">🏆 Giải thưởng</button><button class="nav" data-page="results">📋 Kết quả</button><button class="nav" data-page="settings">⚙️ Cài đặt</button><div class="grow"></div><div class="status">● Dữ liệu lưu trên máy</div></aside><main><section id="draw" class="page active"><header><div><h1 id="title"></h1><p id="subtitle"></p></div><button id="fullscreen">⛶ Toàn màn hình</button></header><div class="stage"><div id="prizeLabel" class="prizeLabel"></div><div id="roller" class="roller">0000</div><div id="winner" class="winner"></div><button id="drawBtn" class="drawBtn">BẮT ĐẦU QUAY</button><div id="remain"></div></div></section><section id="people" class="page"><h2>Người tham gia</h2><div class="toolbar"><input type="file" id="excel" accept=".xlsx,.xls,.csv"><button id="sample">Tải mẫu CSV</button><button id="clearPeople" class="danger">Xóa danh sách</button></div><div id="peopleInfo"></div><div class="table"><table id="peopleTable"></table></div></section><section id="prizes" class="page"><h2>Giải thưởng</h2><div class="toolbar"><input id="pname" placeholder="Tên giải"><input id="pqty" type="number" min="1" value="1"><input id="pdraw" type="number" min="1" value="1"><button id="addPrize">+ Thêm giải</button></div><div id="prizeList"></div></section><section id="results" class="page"><h2>Kết quả</h2><div class="toolbar"><button id="export">Xuất Excel</button><button id="pdf">Xuất PDF</button><button id="reset" class="danger">Reset kết quả</button></div><div class="table"><table id="resultTable"></table></div></section><section id="settings" class="page"><h2>Cài đặt</h2><div class="settings"><label>Tên sự kiện<input id="sTitle"></label><label>Phụ đề<input id="sSub"></label><label>Trường hiển thị khi quay<select id="drawField"><option value="code">Mã</option><option value="name">Họ tên</option><option value="phone">Điện thoại</option><option value="qr">QR</option></select></label><label><span>Cho phép trúng nhiều lần</span><input id="repeat" type="checkbox"></label><label>Thời gian quay (giây)<input id="duration" type="number" min="1" max="20"></label><label>Màu nền<input id="bg" type="color"></label><label>Màu nhấn<input id="accent" type="color"></label><div class="toolbar"><button id="saveSettings">Lưu</button><button id="backup">Sao lưu</button><button id="restore">Khôi phục</button></div></div></section></main></div><canvas id="fx"></canvas><script src="xlsx.full.min.js"></script><script src="app.js"></script></body></html>
